<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Chat</title>
    <script>
        let connectionStatus = "disconnected";
        let connectionCheckInterval = null;
        let chatRefreshInterval = null;

        let chatAutoScroll = true;
        let offensiveAutoScroll = true;
        let currentSentimentModel = "loading";

async function fetchSentimentModel() {
    try {
        const response = await fetch("/get_sentiment_model");
        const data = await response.json();
        currentSentimentModel = data.model;
        updateSentimentButton();
    } catch (error) {
        console.error("Error fetching sentiment model:", error);
    }
}

async function toggleSentimentModel() {
    const newModel = currentSentimentModel === "vader" ? "huggingface" : "vader";

    try {
        const response = await fetch("/set_sentiment_model", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: newModel }),
        });

        const result = await response.json();
        if (result.success) {
            currentSentimentModel = newModel;
            updateSentimentButton();
        } else {
            console.error("Failed to update sentiment model.");
        }
    } catch (error) {
        console.error("Error toggling sentiment model:", error);
    }
}

function updateSentimentButton() {
    const sentimentBtn = document.getElementById("toggle-sentiment-btn");
    if (currentSentimentModel === "vader") {
        sentimentBtn.textContent = "Using VADER Sentiment(Switch to Multi-Language Model)";
    } else {
        sentimentBtn.textContent = "Using Multi-Language Model (Switch to VADER Sentiment)";
    }
}

window.onload = function() {
    resetApp();
    setupScrollListeners();
    fetchSentimentModel();
};


        async function startChat() {
            const url = document.getElementById("twitch-url").value;
            if (!url) {
                updateStatus("error", "Please enter a valid Twitch URL");
                return;
            }

            updateStatus("connecting", "Connecting to chat...");

            try {
                const response = await fetch("/start_chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url }),
                });

                const result = await response.json();
                if (result.success) {
                    updateStatus("connected", "Connected to chat");
                    if (connectionCheckInterval) clearInterval(connectionCheckInterval);
                    connectionCheckInterval = setInterval(checkConnection, 5000);

                    if (chatRefreshInterval) clearInterval(chatRefreshInterval);
                    chatRefreshInterval = setInterval(refreshChats, 500);

                    sessionStorage.setItem("currentTwitchUrl", url);

                    chatAutoScroll = true;
                    offensiveAutoScroll = true;
                } else {
                    updateStatus("error", "Failed to connect to chat");
                }
            } catch (error) {
                updateStatus("error", "Error connecting to chat");
                console.error("Connection error:", error);
            }
        }

        function updateStatus(status, message) {
            connectionStatus = status;

            const statusElements = document.querySelectorAll(".connection-status");
            statusElements.forEach(element => {
                element.classList.remove("connecting", "connected", "disconnected", "error", "offline")
                element.classList.add(status);
                element.textContent = message;
            });
        }

        async function checkConnection() {
            try {
                const response = await fetch("/json");
                const messages = await response.json();
                const lastCheckTime = sessionStorage.getItem("lastMessageCount") || "0";

                if (messages.length > 0) {
                    if (messages.length === parseInt(lastCheckTime) && connectionStatus === "connected") {
                        const timeSinceLastMessage = (new Date() - new Date(messages[messages.length - 1].timestamp)) / 1000;
                        if (timeSinceLastMessage > 120) {
                            updateStatus("offline", "Streamer may be offline");
                        }
                    } else {
                        updateStatus("connected", "Connected to chat");
                    }
                    sessionStorage.setItem("lastMessageCount", messages.length.toString());
                } else if (connectionStatus !== "connecting") {
                    updateStatus("disconnected", "No messages received");
                }
            } catch (error) {
                updateStatus("error", "Connection error");
                console.error("Check connection error:", error);
            }
        }

        function isScrolledToBottom(element) {
            return Math.abs(element.scrollHeight - element.clientHeight - element.scrollTop) < 30;
        }

        async function loadChat() {
            const chatBox = document.getElementById("chat-box");
            const chatMessages = document.getElementById("chat-messages");

            chatAutoScroll = isScrolledToBottom(chatMessages);

            try {
                const response = await fetch("/json");
                const messages = await response.json();

                let chatHTML = "";
                if (messages.length > 0) {
                 chatHTML = messages.map(m =>

                `<div style="background: ${m.is_offensive ? '#862f2f' : 'transparent'};"><p>
                    <b style="color:${m.colour};">${m.author.display_name}:</b> ${m.message}
                </p></div>
                `
            ).join("");
}

                chatMessages.innerHTML = chatHTML;

                if (chatAutoScroll) {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            } catch (error) {
                console.error("Error loading chat:", error);
            }
        }

        async function loadOffensiveChat() {
            const offensiveBox = document.getElementById("offensive-box");
            const offensiveMessages = document.getElementById("offensive-messages");

            offensiveAutoScroll = isScrolledToBottom(offensiveMessages);

            try {
                const response = await fetch("/offensive_json");
                const messages = await response.json();

                let offensiveHTML = "";
                if (messages.length > 0) {
                    offensiveHTML = messages.map(m => `<p><b style="color:${m.colour};">${m.author.display_name}:</b> ${m.message}</p>`).join("");
                }

                offensiveMessages.innerHTML = offensiveHTML;

                if (offensiveAutoScroll) {
                    offensiveMessages.scrollTop = offensiveMessages.scrollHeight;
                }
            } catch (error) {
                console.error("Error loading offensive chat:", error);
            }
        }

        function refreshChats() {
            loadChat();
            loadOffensiveChat();
        }

        function resetApp() {
            sessionStorage.removeItem("currentTwitchUrl");
            sessionStorage.removeItem("lastMessageCount");

            if (connectionCheckInterval) clearInterval(connectionCheckInterval);
            if (chatRefreshInterval) clearInterval(chatRefreshInterval);

            document.getElementById("twitch-url").value = "";
            document.getElementById("chat-messages").innerHTML = "";
            document.getElementById("offensive-messages").innerHTML = "";

            updateStatus("disconnected", "Disconnected");

            chatAutoScroll = true;
            offensiveAutoScroll = true;

            fetch("/reset", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ reset: true }),
            }).catch(error => console.error("Error sending reset:", error));
        }

        function setupScrollListeners() {
            const chatMessages = document.getElementById("chat-messages");
            const offensiveMessages = document.getElementById("offensive-messages");

            chatMessages.addEventListener("scroll", function() {
                chatAutoScroll = isScrolledToBottom(chatMessages);

                updateAutoScrollIndicator("chat-auto-scroll", chatAutoScroll);
            });

            offensiveMessages.addEventListener("scroll", function() {
                offensiveAutoScroll = isScrolledToBottom(offensiveMessages);

                updateAutoScrollIndicator("offensive-auto-scroll", offensiveAutoScroll);
            });
        }

        function updateAutoScrollIndicator(id, isActive) {
            const indicator = document.getElementById(id);
            if (indicator) {
                indicator.classList.toggle("active", isActive);
                indicator.title = isActive ? "Auto-scroll is on" : "Auto-scroll is off";
            }
        }

        window.addEventListener("beforeunload", function() {
            resetApp();
        });
    </script>
    <style>

        body {
            background-color: #262626;
            color: #000000;
             font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        body h1
        {
            color: #ffffff;
        }
        #container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        #container h2
        {
            color: #ffffff;
        }

         .chat-container {
            width: 500px;
            height: 400px;
            border-radius: 20px;
            border: 2px solid black;
            overflow-y: auto;
            background: #3b3b3b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            resize: vertical;
            min-height: 200px;
            max-height: 700px;
        }

        .resizer {
            width: 100%;
            height: 10px;
            background: #b9a3e3;
            cursor: ns-resize;
            position: absolute;
            bottom: 0;
            left: 0;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .connection-status {
            padding: 8px;
            font-weight: bold;
            text-align: center;
            color: white;
            align-self: center;


        }
        .connection-status.connected {
            background-color: #4CAF50;
        }
        .connection-status.connecting {
            background-color: #2196F3;
        }
        .connection-status.disconnected {
            background-color: #9E9E9E;
        }
        .connection-status.error {
            background-color: #F44336;
        }
        .connection-status.offline {
            background-color: #FF9800;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            scroll-behavior: smooth;
        }
        .auto-scroll-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ccc;
            z-index: 10;
            opacity: 0.7;
        }
        .auto-scroll-indicator.active {
            background-color: #4CAF50;
        }
        h2 { margin: 0; padding-bottom: 10px; }
        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        #twitch-url {
            padding: 10px;
            width: 300px;
            border: 2px solid #9147ff;
            border-radius: 5px;
        }
        button, .connection-status {
            padding: 10px 16px;
            min-width: 120px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        button {
            background-color: #9147ff;
            color: white;
            border-color: #9147ff;
            cursor: pointer;
        }
        button:hover {
            background-color: #772ce8;
        }
        p {
            text-align: left;
            margin: 5px 0;
        }
        @media (max-width: 1100px) {
            #container {
                flex-direction: column;
                align-items: center;
            }
            .chat-container {
                margin-bottom: 20px;
            }
        }

        ::-webkit-scrollbar {
        width: 10px;
        }

        /* Track */
        ::-webkit-scrollbar-track {
        background: transparent;
        }

        /* Handle */
        ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px

        }

        /* Handle on hover */
        ::-webkit-scrollbar-thumb:hover {
        background: #555;
        border-radius: 10px
        }
    </style>
</head>
<body>
    <h1>Twitch Chat Viewer</h1>
    <div class="input-container">
    <input type="text" id="twitch-url" placeholder="Enter Twitch URL">
    <button onclick="startChat()">Start Chat</button>
    <div class="connection-status disconnected">Disconnected</div>
    <button id="toggle-sentiment-btn" onclick="toggleSentimentModel()">Loading...</button>
</div>




    </div>
    <div id="container">
        <div>
            <h2>Chat</h2>
            <div id="chat-box" class="chat-container">

                <div id="chat-messages" class="chat-messages"></div>



            </div>

        </div>
        <div>
            <h2>Offensive Messages</h2>
            <div id="offensive-box" class="chat-container" style="background: #862f2f;">

                <div id="offensive-messages" class="chat-messages"></div>




            </div>
        </div>
    </div>
</body>
</html>
